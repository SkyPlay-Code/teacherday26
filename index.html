<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Memories Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0f19;
            --card-bg: rgba(23, 32, 51, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 80px;
        }

        header {
            max-width: 1280px;
            margin: 0 auto 28px;
            text-align: center;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, #fff 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p { color: var(--text-sub); font-size: 0.95rem; }

        /* Toolbar Controls */
        .toolbar {
            max-width: 1280px;
            margin: 0 auto 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-bar {
            flex: 1 1 240px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 18px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(12px);
            transition: 0.2s;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .btn-action.primary {
            background: var(--accent);
            color: #0b0f19;
            border: none;
        }

        /* Filter Pills */
        .filter-group {
            display: flex;
            gap: 8px;
            max-width: 1280px;
            margin: 0 auto 24px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #0b0f19;
            border-color: var(--accent);
        }

        /* Gallery Grid */
        #gallery {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card-thumb-wrap {
            position: relative;
            width: 100%;
            padding-top: 66.66%;
            background: #0f172a;
            cursor: pointer;
            overflow: hidden;
        }

        .card-thumb-wrap img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-thumb-wrap img { transform: scale(1.05); }

        .tag-indicator {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(11, 15, 25, 0.8);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--card-border);
        }

        .card-body {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn-small {
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn-small:hover { background: rgba(56, 189, 248, 0.15); }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(16px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        #lightbox.active { display: flex; }

        #lightbox-content {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            object-fit: contain;
        }

        .lightbox-controls {
            position: absolute;
            top: 16px; right: 16px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .status-pane {
            text-align: center;
            padding: 60px 16px;
            color: var(--text-sub);
        }

        #error-screen {
            display: none;
            text-align: center;
            padding-top: 100px;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div id="error-screen">
        <h2 style="color: #ef4444; margin-bottom: 8px;">503 Service Unavailable</h2>
        <p style="color: var(--text-sub);">The server is temporarily down for scheduled maintenance.</p>
    </div>

    <div id="main-content">
        <header>
            <h1>Class Memories</h1>
            <p id="counter">Loading archive...</p>
        </header>

        <div class="toolbar">
            <input type="text" id="search-input" class="search-bar" placeholder="Search filenames...">
            <button id="download-all-btn" class="btn-action primary">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Download Visible
            </button>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" onclick="setFilter('all')">All Items</button>
            <button class="filter-btn" onclick="setFilter('image')">Photos Only</button>
            <button class="filter-btn" onclick="setFilter('video')">Videos Only</button>
        </div>

        <div id="status" class="status-pane">Fetching gallery items from Drive...</div>
        <div id="gallery"></div>
    </div>

    <div id="lightbox">
        <div class="lightbox-controls">
            <a id="lightbox-drive" class="icon-btn" target="_blank">Open in Drive</a>
            <a id="lightbox-download" class="icon-btn" download>Download</a>
            <button class="icon-btn" onclick="closeLightbox()">✕</button>
        </div>
        <div id="lightbox-media-container"></div>
    </div>

    <div id="toast">Link copied to clipboard!</div>

    <script>
        if (document.cookie.includes("access_token=revoked")) {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('error-screen').style.display = 'block';
        } else {
            const API_URL = 'https://script.google.com/macros/s/AKfycbyLW4Nq0icyTFpfaV32ExvJFwR6I8f1dqIN5ec76bl4ulmemg2Yxnn27V-5fTt769YU/exec'; // Replace with your Web App URL
            let allFiles = [];
            let currentFilter = 'all';

            const gallery = document.getElementById('gallery');
            const status = document.getElementById('status');
            const searchInput = document.getElementById('search-input');
            const counter = document.getElementById('counter');

            fetch(API_URL)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        status.style.display = 'none';
                        allFiles = res.data;
                        renderGallery();
                    } else {
                        status.innerText = 'Error: ' + res.message;
                    }
                })
                .catch(() => {
                    status.innerText = 'Could not load gallery. Check connection or script permissions.';
                });

            function renderGallery() {
                gallery.innerHTML = '';
                const query = searchInput.value.toLowerCase();

                const filtered = allFiles.filter(file => {
                    const matchesSearch = file.name.toLowerCase().includes(query);
                    const matchesFilter = currentFilter === 'all' || file.type.includes(currentFilter);
                    return matchesSearch && matchesFilter;
                });

                counter.innerText = `${filtered.length} files available`;

                if (filtered.length === 0) {
                    gallery.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px;">No files found matching criteria.</div>';
                    return;
                }

                filtered.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const isVideo = file.type.includes('video');

                    card.innerHTML = `
                        <div class="card-thumb-wrap" onclick="openLightbox('${file.id}', '${escape(file.name)}', ${isVideo}, '${file.driveUrl}')">
                            <span class="tag-indicator">${isVideo ? '▶ Video' : '📷 Photo'}</span>
                            <img src="${file.thumbnailUrl}" alt="${file.name}" loading="lazy" onerror="this.src='https://placehold.co/600x400/172033/94a3b8?text=File';">
                        </div>
                        <div class="card-body">
                            <span class="card-title" title="${file.name}">${file.name}</span>
                            <div class="card-actions">
                                <button class="icon-btn-small" onclick="shareItem('${file.driveUrl}')" title="Copy Direct Link">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                                </button>
                                <a class="icon-btn-small" href="https://drive.google.com/uc?export=download&id=${file.id}" target="_blank" title="Download">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                </a>
                            </div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            }

            window.setFilter = function(type) {
                currentFilter = type;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                renderGallery();
            };

            searchInput.addEventListener('input', renderGallery);

            window.shareItem = function(url) {
                navigator.clipboard.writeText(url).then(() => {
                    const toast = document.getElementById('toast');
                    toast.style.display = 'block';
                    setTimeout(() => toast.style.display = 'none', 2000);
                });
            };

            window.openLightbox = function(id, rawName, isVideo, driveUrl) {
                const name = unescape(rawName);
                const container = document.getElementById('lightbox-media-container');
                
                document.getElementById('lightbox-download').href = `https://drive.google.com/uc?export=download&id=${id}`;
                document.getElementById('lightbox-drive').href = driveUrl;

                if (isVideo) {
                    container.innerHTML = `
                        <iframe id="lightbox-content" src="https://drive.google.com/file/d/${id}/preview" 
                            style="width: 80vw; height: 70vh; border: none; border-radius: 12px;" allow="autoplay"></iframe>
                    `;
                } else {
                    container.innerHTML = `<img id="lightbox-content" src="https://lh3.googleusercontent.com/d/${id}=w2048" alt="${name}">`;
                }

                document.getElementById('lightbox').classList.add('active');
            };

            window.closeLightbox = function() {
                document.getElementById('lightbox').classList.remove('active');
                document.getElementById('lightbox-media-container').innerHTML = '';
            };

            document.getElementById('lightbox').addEventListener('click', (e) => {
                if (e.target.id === 'lightbox') closeLightbox();
            });

            document.getElementById('download-all-btn').addEventListener('click', () => {
                const query = searchInput.value.toLowerCase();
                const visible = allFiles.filter(file => {
                    const matchesSearch = file.name.toLowerCase().includes(query);
                    const matchesFilter = currentFilter === 'all' || file.type.includes(currentFilter);
                    return matchesSearch && matchesFilter;
                });

                if (!confirm(`Queueing download for ${visible.length} items. Tap OK to start.`)) return;

                visible.forEach((file, index) => {
                    setTimeout(() => {
                        const link = document.createElement('a');
                        link.href = `https://drive.google.com/uc?export=download&id=${file.id}`;
                        link.setAttribute('download', file.name);
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }, index * 800);
                });
            });
        }
    </script>
</body>
</html>
